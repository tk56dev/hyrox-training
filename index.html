<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUKAI | HYROX TRAINING</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:    #000000;
  --bg1:      #0D0D0D;
  --bg2:      #141414;
  --bg3:      #1E1E1E;
  --border:   #2A2A2A;
  --border2:  #383838;
  --muted:    #555555;
  --sub:      #888888;
  --text:     #FFFFFF;
  --red:      #E30613;
  --red-dim:  #7a030a;
  --green:    #16A34A;
  --blue:     #2563EB;
  --orange:   #D97706;
}

html, body {
  height: 100%;
}

body {
  background: var(--black);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  height: 60px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--black);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-name {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  background: var(--red);
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px 2px;
  color: #ffffff;
}

.brand-status {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

/* Admin link */
.admin-link {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  transition: all 0.12s;
}
.admin-link:hover { border-color: var(--border2); color: var(--sub); }

/* View toggle */
.view-toggle {
  display: flex;
  border: 1px solid var(--border);
}

.view-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 7px 16px;
  cursor: pointer;
  transition: all 0.12s;
  border-right: 1px solid var(--border);
}

.view-btn:last-child { border-right: none; }
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--text); color: var(--black); }

/* Nav controls */
.nav-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.12s;
  flex-shrink: 0;
}

.nav-btn:hover { border-color: var(--text); }

.period-label {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  min-width: 200px;
  text-align: center;
}

/* Today button */
.today-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--sub);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.12s;
}

.today-btn:hover { border-color: var(--text); color: var(--text); }

/* ─── MAIN ───────────────────────────────────────────────── */
.main {
  flex: 1;
  padding: 0 40px 40px;
  display: flex;
  flex-direction: column;
}

/* ─── TYPE LEGEND ────────────────────────────────────────── */
.legend {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 0 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
  overflow-x: auto;
  padding-bottom: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.legend-label {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--sub);
}

/* ─── MONTHLY VIEW ───────────────────────────────────────── */
.monthly-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding-top: 16px;
}

.weekday-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 2px;
}

.weekday-label {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 10px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(110px, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  flex: 1;
}

.day-cell {
  background: var(--bg1);
  padding: 10px;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
  overflow: hidden;
}

.day-cell:hover { background: var(--bg2); }

.day-cell.other-month {
  background: var(--black);
}

.day-cell.other-month .day-num {
  color: var(--border2);
}

.day-cell.is-today {
  background: var(--bg2);
}

.day-num {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.today-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--red);
  color: #fff;
  width: 20px;
  height: 20px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
}

.event-chip {
  display: block;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0;
  padding: 3px 6px 2px;
  margin-bottom: 2px;
  border-left: 2px solid var(--red);
  background: rgba(255,255,255,0.04);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  color: var(--text);
  transition: background 0.1s;
}

.event-chip:hover { background: rgba(255,255,255,0.1); }

.event-chip.t-hyrox     { border-color: var(--red); }
.event-chip.t-run       { border-color: var(--green); }
.event-chip.t-strength  { border-color: var(--blue); }
.event-chip.t-endurance { border-color: var(--orange); }
.event-chip.t-race      { border-color: var(--red); background: var(--red-dim); color: #fff; }

.more-count {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 10px;
  color: var(--muted);
  padding: 2px 6px;
}

/* ─── MOBILE: monthly chips → small colored dots ────────── */
@media (max-width: 640px) {
  .event-chip {
    font-size: 0 !important;
    width: 8px !important;
    height: 8px !important;
    border-radius: 50% !important;
    border-left: none !important;
    display: inline-block !important;
    padding: 0 !important;
    margin: 2px !important;
    box-sizing: border-box !important;
    flex-shrink: 0;
    pointer-events: none; /* タップは日付セル全体で受ける */
  }
  .event-chip::after { display: none !important; }
  .event-chip.t-hyrox     { background: var(--red) !important; }
  .event-chip.t-run       { background: var(--green) !important; }
  .event-chip.t-strength  { background: var(--blue) !important; }
  .event-chip.t-endurance { background: var(--orange) !important; }
  .event-chip.t-race      { background: var(--red) !important; }

  .day-num { font-size: 11px; }
  .calendar-grid { grid-auto-rows: minmax(70px, 1fr); }
  .day-cell { padding: 6px 4px; display: flex; flex-direction: column; -webkit-tap-highlight-color: rgba(255,255,255,0.08); }
  .dots-row { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
  .more-count { font-size: 9px; padding: 2px 4px; }
}

/* ─── WEEKLY VIEW ────────────────────────────────────────── */
.weekly-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding-top: 16px;
}

.week-wrapper {
  display: flex;
  flex: 1;
  border: 1px solid var(--border);
  overflow: auto;
}

.time-col {
  width: 52px;
  flex-shrink: 0;
  background: var(--black);
  border-right: 1px solid var(--border);
}

.time-col-header {
  height: 56px;
  border-bottom: 1px solid var(--border);
}

.time-label {
  height: 60px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 4px 8px 0 0;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

.days-wrap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  flex: 1;
  gap: 1px;
  background: var(--border);
}

.day-col {
  background: var(--bg1);
  display: flex;
  flex-direction: column;
}

.day-col-header {
  height: 56px;
  padding: 10px 10px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
}

.wk-day-name {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1;
}

.wk-day-num {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 26px;
  line-height: 1.1;
  color: var(--text);
}

.day-col.wk-today .day-col-header {
  border-bottom-color: var(--red);
}

.day-col.wk-today .wk-day-num {
  color: var(--red);
}

.day-slots {
  flex: 1;
  position: relative;
}

.slot-row {
  height: 60px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.wk-event {
  position: absolute;
  left: 3px;
  right: 3px;
  min-height: 22px;
  padding: 4px 6px 3px;
  border-left: 3px solid var(--red);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  z-index: 10;
  transition: background 0.1s;
  overflow: hidden;
}

.wk-event:hover { background: rgba(255,255,255,0.1); }

.wk-event-time {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0;
  color: var(--sub);
  line-height: 1;
}

.wk-event-theme {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0;
  color: var(--text);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wk-event.t-hyrox     { border-color: var(--red); }
.wk-event.t-run       { border-color: var(--green); }
.wk-event.t-strength  { border-color: var(--blue); }
.wk-event.t-endurance { border-color: var(--orange); }
.wk-event.t-race      { border-color: var(--red); background: var(--red-dim); }

.all-day-bar {
  position: relative;
  margin: 4px 3px 0;
}

/* ─── DETAIL PANEL ───────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s;
  overflow: hidden;
}

.overlay.open {
  opacity: 1;
  pointer-events: all;
}

.detail-panel {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-bottom: none;
  width: 100%;
  max-width: 600px;
  max-height: 78vh;
  overflow-y: auto;
  padding: 32px 36px 44px;
  position: relative;
  transform: translateY(24px);
  transition: transform 0.18s;
  flex-shrink: 0;
}

.overlay.open .detail-panel {
  transform: translateY(0);
}

.detail-type-bar {
  width: 40px;
  height: 3px;
  background: var(--red);
  margin-bottom: 20px;
}

.detail-date-str {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.detail-theme {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-bottom: 14px;
}

.detail-time {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--red);
  margin-bottom: 20px;
}

.detail-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin-bottom: 20px;
}

.detail-notes-label {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.detail-notes {
  font-size: 15px;
  color: var(--sub);
  line-height: 1.65;
  white-space: pre-wrap;
}

.detail-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.12s;
}

.detail-close:hover { border-color: var(--text); }

/* ─── EMPTY STATE ────────────────────────────────────────── */
.empty-day {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--border2);
  padding: 4px 0;
}

/* ─── STATUS BAR ─────────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0 0;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

.status-left {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.status-right {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--border2);
}

/* ─── DAY EVENT LIST ─────────────────────────────────────── */
.day-list-date {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}
.day-list-item {
  border-left: 3px solid var(--red);
  background: rgba(255,255,255,0.04);
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.1s;
}
.day-list-item:hover, .day-list-item:active { background: rgba(255,255,255,0.12); }
.day-list-theme {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}
.day-list-time {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* ─── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 900px) {
  .header { padding: 0 20px; }
  .main { padding: 0 20px 30px; }
  .brand-status { display: none; }
  .period-label { min-width: 140px; font-size: 13px; }
  .detail-panel { padding: 28px 24px 40px; }
  .detail-theme { font-size: 28px; }
  .admin-link { display: none; }
}

@media (max-width: 640px) {
  .brand-name { font-size: 18px; }
  .today-btn { display: none; }
  .days-wrap { grid-template-columns: repeat(7, minmax(80px, 1fr)); }
}

  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <span class="brand-name">MUKAI</span>
    <span class="brand-badge">WOD</span>
    <span class="brand-status">HYROX Racer</span>
  </div>
  <div class="header-right">
    <a class="admin-link" href="admin.html">ADMIN</a>
    <button class="today-btn" id="todayBtn">TODAY</button>
    <div class="nav-wrap">
      <button class="nav-btn" id="prevBtn">&#8592;</button>
      <span class="period-label" id="periodLabel"></span>
      <button class="nav-btn" id="nextBtn">&#8594;</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btnMonth">MONTH</button>
      <button class="view-btn" id="btnWeek">WEEK</button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="main">
  <!-- rendered by JS -->
</main>

<!-- DETAIL PANEL OVERLAY -->
<div class="overlay" id="overlay">
  <div class="detail-panel">
    <button class="detail-close" id="closeBtn">✕</button>
    <!-- Single event view -->
    <div id="detailSingle">
      <div class="detail-type-bar" id="detailBar"></div>
      <div class="detail-date-str" id="detailDateStr"></div>
      <div class="detail-theme" id="detailTheme"></div>
      <div class="detail-time" id="detailTime"></div>
      <hr class="detail-divider">
      <div class="detail-notes-label">NOTES</div>
      <div class="detail-notes" id="detailNotes"></div>
    </div>
    <!-- Day events list view (複数イベントがある日) -->
    <div id="detailDayList" style="display:none">
      <div class="day-list-date" id="listDateStr"></div>
      <div id="listItems"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const CONFIG = {

// ═══════════════════════════════════════════════════════════════
//  SAMPLE DATA — GAS・CSV どちらも読み込めない場合に使用
// ═══════════════════════════════════════════════════════════════
const SAMPLE = [

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════════════════════════════
const MONTHS  = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const DAYS    = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const TYPE_COLORS = { hyrox:'#E30613', run:'#16A34A', strength:'#2563EB', endurance:'#D97706', race:'#E30613' };
const LEGEND_ITEMS = [
  { type:'hyrox',     label:'HYROX' },
  { type:'run',       label:'RUN' },
  { type:'strength',  label:'STRENGTH' },
  { type:'endurance', label:'ENDURANCE' },
  { type:'race',      label:'RACE' },
];

let view       = 'month';
let current    = new Date();
let events     = [];
let dataSource = 'SAMPLE';

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseYMD(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function typeClass(t) {
  const map = {
    HYROX:'hyrox', WOD:'hyrox',
    RUN:'run',
    STRENGTH:'strength',
    ENDURANCE:'endurance', SKIERG:'endurance', ROW:'endurance', RECOVERY:'endurance',
    RACE:'race'
  };
  return map[(t||'').toUpperCase()] || 'hyrox';
}

function typeColor(t) { return TYPE_COLORS[typeClass(t)] || TYPE_COLORS.hyrox; }

function timeToMinutes(t) {
  if (!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}

function forDate(dateStr) {
  return events.filter(e => e.date === dateStr);
}

function weekStart(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay());
  dt.setHours(0,0,0,0);
  return dt;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
//  JSONP — GAS呼び出し (CORSなし)
// ═══════════════════════════════════════════════════════════════
function callScript(url, params) {
  return new Promise((resolve, reject) => {
    const cbName = '_hyroxCb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const qs = Object.entries(params)
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
      .join('&');
    const src = url + '?' + qs + '&callback=' + cbName;
    let timer;
    window[cbName] = function(data) {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
      resolve(data);
    };
    timer = setTimeout(function() {
      delete window[cbName];
      if (script.parentNode) script.remove();
      reject(new Error('タイムアウト'));
    }, 10000);
    const script = document.createElement('script');
    script.src = src;
    script.onerror = function() {
      clearTimeout(timer);
      delete window[cbName];
      reject(new Error('スクリプト読み込みエラー'));
    };
    document.head.appendChild(script);
  });
}

// ═══════════════════════════════════════════════════════════════
//  CSV PARSER — RFC4180準拠（改行を含むセルに対応）
// ═══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, cols = [];

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; }
        else { inQ = false; }
      } else {
        cur += ch;
      }
    } else {
      if (ch === '"') {
        inQ = true;
      } else if (ch === ',') {
        cols.push(cur); cur = '';
      } else if (ch === '\r' && text[i + 1] === '\n') {
        cols.push(cur); cur = '';
        rows.push(cols); cols = [];
        i++; // skip \n
      } else if (ch === '\n' || ch === '\r') {
        cols.push(cur); cur = '';
        rows.push(cols); cols = [];
      } else {
        cur += ch;
      }
    }
  }
  // 末尾の残り
  if (cur || cols.length) { cols.push(cur); rows.push(cols); }

  if (rows.length < 2) return [];
  const result = [];
  for (let i = 1; i < rows.length; i++) {
    const c = rows[i];
    if (!c[0] || !c[0].trim()) continue;
    result.push({
      date:  (c[0] || '').trim(),
      start: (c[1] || '').trim(),
      end:   (c[2] || '').trim(),
      theme: (c[3] || '').trim() || '(無題)',
      type:  (c[4] || '').trim() || 'WOD',
      notes: (c[5] || '').trim(),
      id:    (c[6] || '').trim(),
    });
  }
  return result;
}

// ═══════════════════════════════════════════════════════════════
//  DATA LOADING
//  優先順位: GAS (localStorage) → 公開CSV → サンプル
// ═══════════════════════════════════════════════════════════════
async function loadEvents() {
  // 1. GAS経由で読み込み（localStorageにURLがある場合）
  const gasUrl = localStorage.getItem('hyrox_script_url');
  if (gasUrl) {
    try {
      const result = await callScript(gasUrl, { action: 'list' });
      if (result && Array.isArray(result.entries)) {
        events = result.entries.map(function(e) {
          return {
            date:  e.date  || '',
            start: e.start || '',
            end:   e.end   || '',
            theme: e.theme || '(無題)',
            type:  e.type  || 'WOD',
            notes: e.notes || '',
            id:    e.id    || '',
          };
        });
        dataSource = 'GAS';
        return;
      }
    } catch(err) {
      console.warn('[HYROX Calendar] GAS読み込み失敗。CSVにフォールバックします。', err);
    }
  }

  // 2. 公開CSV経由で読み込み
  if (CONFIG.SHEET_URL) {
    try {
      const res = await fetch(CONFIG.SHEET_URL);
      if (!res.ok) throw new Error('HTTPエラー: ' + res.status);
      const text = await res.text();
      const parsed = parseCSV(text);
      if (parsed.length > 0) {
        events = parsed;
        dataSource = 'CSV';
        return;
      }
    } catch(err) {
      console.warn('[HYROX Calendar] CSV読み込み失敗。サンプルデータを使用します。', err);
    }
  }

  // 3. サンプルデータにフォールバック
  events = SAMPLE;
  dataSource = 'SAMPLE';
}

// ═══════════════════════════════════════════════════════════════
//  RENDER — LEGEND
// ═══════════════════════════════════════════════════════════════
function renderLegend() {
  return '<div class="legend">' +
    LEGEND_ITEMS.map(function(li) {
      return '<div class="legend-item">' +
        '<div class="legend-dot" style="background:' + TYPE_COLORS[li.type] + '"></div>' +
        '<span class="legend-label">' + li.label + '</span>' +
        '</div>';
    }).join('') +
    '</div>';
}

// ═══════════════════════════════════════════════════════════════
//  RENDER — MONTHLY
// ═══════════════════════════════════════════════════════════════
function renderMonthly() {
  const y = current.getFullYear();
  const m = current.getMonth();
  document.getElementById('periodLabel').textContent = MONTHS[m] + ' ' + y;

  const firstDay = new Date(y, m, 1);
  const lastDay  = new Date(y, m+1, 0);
  const today    = ymd(new Date());
  const pad      = firstDay.getDay();

  let cells = '';

  for (let i = 0; i < pad; i++) {
    const d = new Date(y, m, 1 - (pad - i));
    cells += dayCell(d, true, today);
  }
  for (let d = 1; d <= lastDay.getDate(); d++) {
    cells += dayCell(new Date(y, m, d), false, today);
  }
  const total = pad + lastDay.getDate();
  const trail = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= trail; i++) {
    cells += dayCell(new Date(y, m+1, i), true, today);
  }

  const weekdayRow = DAYS.map(function(d) {
    return '<div class="weekday-label">' + d + '</div>';
  }).join('');

  return renderLegend() +
    '<div class="monthly-view">' +
      '<div class="weekday-row">' + weekdayRow + '</div>' +
      '<div class="calendar-grid">' + cells + '</div>' +
    '</div>';
}

function dayCell(date, otherMonth, today) {
  const ds   = ymd(date);
  const evts = forDate(ds);
  const isToday = ds === today;

  let cls = 'day-cell';
  if (otherMonth) cls += ' other-month';
  if (isToday)    cls += ' is-today';

  const numHtml = isToday
    ? '<div class="today-dot">' + date.getDate() + '</div>'
    : date.getDate();

  // モバイルではdots、デスクトップではchips
  const chips = evts.slice(0, 3).map(function(e, i) {
    const idx = events.indexOf(e);
    return '<span class="event-chip t-' + typeClass(e.type) + '"' +
      ' onclick="openDetail(event,\'' + ds + '\',' + idx + ')">' +
      escHtml(e.theme) +
      '</span>';
  }).join('');

  const more = evts.length > 3
    ? '<span class="more-count">+' + (evts.length - 3) + '</span>' : '';

  // タップ全体でイベント詳細を開く（モバイルでdotsが小さい場合のため）
  const cellClick = evts.length > 0 ? ' onclick="openDayDetail(event,\'' + ds + '\')"' : '';

  return '<div class="' + cls + '"' + cellClick + '>' +
    '<div class="day-num">' + numHtml + '</div>' +
    '<div class="dots-row">' + chips + more + '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════════════
//  RENDER — WEEKLY
// ═══════════════════════════════════════════════════════════════
function renderWeekly() {
  const ws    = weekStart(current);
  const we    = new Date(ws); we.setDate(we.getDate() + 6);
  const today = ymd(new Date());

  const sLabel = ws.getDate() + ' ' + MONTHS[ws.getMonth()].slice(0,3);
  const eLabel = we.getDate() + ' ' + MONTHS[we.getMonth()].slice(0,3) + ' ' + we.getFullYear();
  document.getElementById('periodLabel').textContent = sLabel + ' \u2013 ' + eLabel;

  const START  = CONFIG.START_HOUR;
  const END    = CONFIG.END_HOUR;
  const HOURS  = END - START;
  const SLOT_H = 60;

  let dayCols = '';
  for (let di = 0; di < 7; di++) {
    const d = new Date(ws); d.setDate(d.getDate() + di);
    const ds = ymd(d);
    const isToday = ds === today;
    const dayEvts = forDate(ds);

    const allDay = dayEvts.filter(function(e) { return !e.start; });
    const timed  = dayEvts.filter(function(e) { return  e.start; });

    const allDayHtml = allDay.map(function(e) {
      const idx = events.indexOf(e);
      return '<div class="event-chip t-' + typeClass(e.type) + ' all-day-bar"' +
        ' style="border-left-color:' + typeColor(e.type) + ';cursor:pointer;display:block;margin:2px 3px;"' +
        ' onclick="openDetail(event,\'' + ds + '\',' + idx + ')">' +
        escHtml(e.theme) +
        '</div>';
    }).join('');

    let slots = allDayHtml;
    slots += '<div style="position:relative;height:' + (HOURS * SLOT_H) + 'px;">';

    for (let h = 0; h < HOURS; h++) {
      slots += '<div style="position:absolute;top:' + (h*SLOT_H) + 'px;left:0;right:0;height:' + SLOT_H + 'px;border-bottom:1px solid var(--border);"></div>';
    }
    for (let h = 0; h < HOURS; h++) {
      slots += '<div style="position:absolute;top:' + (h*SLOT_H + SLOT_H/2) + 'px;left:0;right:0;border-bottom:1px dashed var(--border);opacity:0.4;"></div>';
    }

    timed.forEach(function(e) {
      const startMin = timeToMinutes(e.start);
      if (startMin === null) return;
      const endMin   = e.end ? timeToMinutes(e.end) : startMin + 60;
      const topPx    = (startMin - START * 60) / 60 * SLOT_H;
      const heightPx = Math.max(22, (endMin - startMin) / 60 * SLOT_H - 2);
      if (topPx < 0 || topPx > HOURS * SLOT_H) return;

      const idx   = events.indexOf(e);
      const color = typeColor(e.type);
      slots += '<div class="wk-event t-' + typeClass(e.type) + '"' +
        ' style="top:' + topPx + 'px;height:' + heightPx + 'px;border-left-color:' + color + ';"' +
        ' onclick="openDetail(event,\'' + ds + '\',' + idx + ')">' +
        '<div class="wk-event-time">' + e.start + (e.end ? ' \u2013 ' + e.end : '') + '</div>' +
        '<div class="wk-event-theme">' + escHtml(e.theme) + '</div>' +
        '</div>';
    });

    slots += '</div>';

    dayCols += '<div class="day-col' + (isToday ? ' wk-today' : '') + '">' +
      '<div class="day-col-header">' +
        '<div class="wk-day-name">' + DAYS[d.getDay()] + '</div>' +
        '<div class="wk-day-num">' + d.getDate() + '</div>' +
      '</div>' +
      '<div class="day-slots">' + slots + '</div>' +
      '</div>';
  }

  let timeCol = '<div class="time-col"><div class="time-col-header"></div>';
  for (let h = START; h < END; h++) {
    timeCol += '<div class="time-label">' + String(h).padStart(2,'0') + ':00</div>';
  }
  timeCol += '</div>';

  return renderLegend() +
    '<div class="weekly-view">' +
      '<div class="week-wrapper">' +
        timeCol +
        '<div class="days-wrap">' + dayCols + '</div>' +
      '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════
function openDetail(ev, dateStr, idx) {
  ev.stopPropagation();
  const e = events[idx];
  if (!e) return;

  const d = parseYMD(dateStr);
  const dateLabel  = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + DAYS[d.getDay()] + '）';
  const typeLabel  = typeClass(e.type).toUpperCase();
  const timeLabel  = e.start
    ? (e.start + (e.end ? '  →  ' + e.end : '') + '  |  ' + typeLabel)
    : ('ALL DAY  |  ' + typeLabel);

  document.getElementById('detailBar').style.background  = typeColor(e.type);
  document.getElementById('detailDateStr').textContent   = dateLabel;
  document.getElementById('detailTheme').textContent     = e.theme;
  document.getElementById('detailTime').textContent      = timeLabel;
  document.getElementById('detailNotes').textContent     = e.notes || '—';
  document.getElementById('detailSingle').style.display  = '';
  document.getElementById('detailDayList').style.display = 'none';

  document.getElementById('overlay').classList.add('open');
}

function openDayDetail(ev, dateStr) {
  ev.stopPropagation();
  const evts = forDate(dateStr);
  if (evts.length === 0) return;
  if (evts.length === 1) {
    openDetail(ev, dateStr, events.indexOf(evts[0]));
    return;
  }
  // 複数イベント → リスト表示
  const d = parseYMD(dateStr);
  const dateLabel = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + DAYS[d.getDay()] + '）';
  document.getElementById('listDateStr').textContent = dateLabel;
  document.getElementById('listItems').innerHTML = evts.map(function(e) {
    const idx     = events.indexOf(e);
    const timeStr = e.start ? (e.start + (e.end ? ' \u2013 ' + e.end : '')) : 'ALL DAY';
    return '<div class="day-list-item t-' + typeClass(e.type) + '"' +
      ' onclick="openDetail(event,\'' + dateStr + '\',' + idx + ')"' +
      ' style="border-left-color:' + typeColor(e.type) + '">' +
      '<div class="day-list-theme">' + escHtml(e.theme) + '</div>' +
      '<div class="day-list-time">' + escHtml(timeStr) + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('detailSingle').style.display  = 'none';
  document.getElementById('detailDayList').style.display = '';
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════
//  NAVIGATION & RENDER
// ═══════════════════════════════════════════════════════════════
function navigate(dir) {
  if (view === 'month') {
    current.setMonth(current.getMonth() + dir);
  } else {
    current.setDate(current.getDate() + dir * 7);
  }
  render();
}

function goToday() {
  current = new Date();
  render();
}

function setView(v) {
  view = v;
  document.getElementById('btnMonth').classList.toggle('active', v === 'month');
  document.getElementById('btnWeek').classList.toggle('active',  v === 'week');
  render();
}

function render() {
  const html = (view === 'month') ? renderMonthly() : renderWeekly();
  const sourceLabel = { GAS: 'LIVE · GAS', CSV: 'CSV', SAMPLE: 'SAMPLE DATA' }[dataSource] || dataSource;
  const statusHtml =
    '<div class="status-bar" style="margin-top:16px;">' +
      '<span class="status-left">HYROX TRAINING CALENDAR \u2014 ' + CONFIG.NAME + '</span>' +
      '<span class="status-right">DATA: ' + sourceLabel + ' · ' + events.length + ' EVENTS</span>' +
    '</div>';
  document.getElementById('main').innerHTML = html + statusHtml;
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
document.getElementById('prevBtn').addEventListener('click',  function() { navigate(-1); });
document.getElementById('nextBtn').addEventListener('click',  function() { navigate(1); });
document.getElementById('todayBtn').addEventListener('click', goToday);
document.getElementById('btnMonth').addEventListener('click', function() { setView('month'); });
document.getElementById('btnWeek').addEventListener('click',  function() { setView('week'); });
document.getElementById('closeBtn').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

loadEvents().then(render);

</script>
